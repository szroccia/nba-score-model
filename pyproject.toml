[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbamodel"
version = "0.1.0"
description = "Predict NBA final scores from pace, efficiency and tonight's lineups"
requires-python = ">=3.10"
dependencies = [
    "nba_api>=1.11",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pdfplumber>=0.11",
    "lxml>=5.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
